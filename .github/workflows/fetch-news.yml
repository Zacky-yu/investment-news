name: Fetch Investment News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: "Fetch RSS and generate data.js"
        run: |
          node scripts/fetch.js

      - name: "Commit and push"
        run: |
          git config user.name "news-bot"
          git config user.email "bot@investment-news"
          git add data.js
          git diff --cached --quiet || git commit -m "auto update news"
          git push
